name: Bug 报告
description: 报告可复现的功能、性能或界面问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿提交 API Key、私人论文、聊天记录或浏览器数据库。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明发生了什么，以及你预期的行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察到……
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11 / Chrome 版本号
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充信息
      description: 可附无敏感信息的截图、控制台错误或最小测试 PDF。
