<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科研阅读工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237B9484' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z'/%3E%3Cpath d='M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>
<div id="app">
  <button id="btn-sb-toggle" title="展开 / 收起文献库" aria-label="展开或收起文献库">文献库</button>
  <aside id="sidebar">
    <div class="sb-brand">
      <span class="brand-mark" id="brand-mark"></span>
      <span class="brand-name">科研阅读工作台</span>
    </div>
    <button id="ws-bar" class="ws-bar" title="切换工作区">
      <span id="ws-name" class="ws-name">…</span>
      <span id="ws-switch-ic" class="ws-switch-ic"></span>
    </button>
    <div class="sb-tools">
      <div class="seg" id="class-mode">
        <button data-mode="tier">等级分类</button>
        <button data-mode="custom">自定义分类</button>
      </div>
      <button id="btn-add-paper" class="btn-add-paper"></button>
      <button id="btn-class-manage" class="btn-ghost-sm"></button>
      <input type="file" id="file-input" accept="application/pdf,.pdf" multiple hidden>
    </div>
    <div id="paper-list" class="sb-list"></div>
  </aside>

  <main id="main">
    <section id="home-view">
      <div id="home-inner"></div>
    </section>
    <section id="reader-view" hidden>
      <div id="reader-toolbar"></div>
      <div id="reader-scroll"><div id="pages-root"></div></div>
    </section>
  </main>

  <aside id="right-panel" hidden>
    <div class="rp-head">
      <div class="rp-tabs" id="rp-tabs">
        <button data-tab="chat" class="active">对话</button>
        <button data-tab="card">论文卡片</button>
        <button data-tab="notes">笔记</button>
      </div>
      <div class="rp-actions">
        <button id="btn-ai-settings" class="ibtn" title="模型配置"></button>
        <button id="btn-rp-collapse" class="ibtn" title="收起面板"></button>
      </div>
    </div>
    <div class="rp-body">
      <div id="tab-chat" class="rp-tab">
        <div id="model-pick" class="model-pick"></div>
      </div>
      <div id="tab-card" class="rp-tab" hidden></div>
      <div id="tab-notes" class="rp-tab" hidden></div>
    </div>
  </aside>
  <button id="btn-rp-expand" class="rp-expand" title="展开 AI 面板"></button>
</div>

<div id="drop-overlay" hidden>
  <div class="drop-card">
    <div class="drop-icon" id="drop-icon"></div>
    <div class="drop-text">松开，将文献添加到待读区</div>
  </div>
</div>
<div id="ctx-layer"></div>
<div id="modal-layer" hidden></div>
<div id="toast-layer"></div>

<script src="vendor/marked-18.0.11/marked.umd.js"></script>
<script src="vendor/dompurify-3.4.14/purify.min.js"></script>
<script src="js/icons.js?v=15"></script>
<script src="js/markdown.js?v=15"></script>
<script src="js/db.js?v=15"></script>
<script src="js/state.js?v=15"></script>
<script src="js/ui.js?v=15"></script>
<script src="js/reader.js?v=15"></script>
<script src="js/ai.js?v=15"></script>
<script src="js/recovery.js?v=15"></script>
<script src="js/main.js?v=15"></script>
</body>
</html>
